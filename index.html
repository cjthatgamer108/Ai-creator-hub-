<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smarter With AI | Pro</title>
    <style>
        :root { --bg: #050505; --text: #ececec; --accent: #10a37f; --sidebar: #000000; --card: #212121; }
        .theme-white { --bg: #ffffff; --text: #0f172a; --accent: #2563eb; --sidebar: #f9fafb; --card: #ffffff; }
        .theme-pink { --bg: #1a0b16; --text: #fdf2f8; --accent: #ec4899; --sidebar: #120610; --card: #2d1226; }

        body { font-family: 'Sone', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; transition: 0.3s; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: var(--sidebar); display: flex; flex-direction: column; padding: 15px; border-right: 1px solid rgba(255,255,255,0.1); }
        .nav-btn { background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,0.2); padding: 10px; border-radius: 5px; cursor: pointer; text-align: left; margin-bottom: 20px; font-weight: bold; }
        .history-list { flex: 1; overflow-y: auto; font-size: 0.9rem; }
        .history-item { padding: 10px; border-radius: 5px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-item:hover { background: rgba(255,255,255,0.1); }

        /* Main Area */
        .main { flex: 1; display: flex; flex-direction: column; position: relative; }
        .header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .model-selector { background: var(--card); color: var(--text); border: 1px solid rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* Chat Window */
        .chat-container { flex: 1; overflow-y: auto; padding: 20px 0; scroll-behavior: smooth; }
        .msg-row { width: 100%; padding: 25px 0; display: flex; justify-content: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .msg-content { width: 80%; max-width: 700px; display: flex; gap: 20px; align-items: flex-start; }
        .avatar { width: 30px; height: 30px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.8rem; }
        .user-avatar { background: #5436da; }
        .ai-avatar { background: var(--accent); }

        /* Input Area */
        .input-area { padding: 20px; display: flex; justify-content: center; background: var(--bg); }
        .input-wrapper { width: 80%; max-width: 750px; position: relative; background: var(--card); border: 1px solid rgba(255,255,255,0.2); border-radius: 15px; padding: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        textarea { width: 100%; background: transparent; border: none; color: var(--text); resize: none; font-size: 1rem; outline: none; padding: 10px; padding-right: 45px; box-sizing: border-box; }
        .send-btn { position: absolute; right: 15px; bottom: 15px; background: var(--accent); color: white; border: none; border-radius: 5px; width: 30px; height: 30px; cursor: pointer; font-size: 1.2rem; }

        /* Payment Modal */
        .overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center; }
        .modal { background: var(--card); padding: 30px; border-radius: 15px; width: 400px; text-align: center; border: 1px solid var(--accent); }

        .theme-swatch { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 1px solid #fff; }
    </style>
</head>
<body id="body">

    <!-- Sidebar -->
    <div class="sidebar">
        <button class="nav-btn" onclick="newChat()">+ New Chat</button>
        <div class="history-list" id="history">
            <div class="history-item">Yesterday: Content Ideas</div>
            <div class="history-item">How to use Midjourney</div>
        </div>
        <div style="padding: 10px; border-top: 1px solid rgba(255,255,255,0.1);">
            <p style="font-size: 0.7rem; opacity: 0.5;">THEMES</p>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <div class="theme-swatch" style="background: #050505;" onclick="setTheme('')"></div>
                <div class="theme-swatch" style="background: #ffffff;" onclick="setTheme('theme-white')"></div>
                <div class="theme-swatch" style="background: #ec4899;" onclick="setTheme('theme-pink')"></div>
            </div>
            <div style="font-size: 0.8rem; cursor: pointer;" onclick="openPay()">💎 Upgrade to Plus</div>
        </div>
    </div>

    <!-- Main -->
    <div class="main">
        <div class="header">
            <select class="model-selector">
                <option>SmarterAI-4o (Default)</option>
                <option>SmarterAI-o1 (Plus Only)</option>
                <option>Image Gen V3</option>
            </select>
            <div style="display: flex; gap: 15px;">
                <div class="bubble" onclick="window.open('https://google.com')"><img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" width="20"></div>
                <div class="bubble" onclick="window.open('https://github.com')"><img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" width="20" style="filter:invert(1)"></div>
            </div>
        </div>

        <div class="chat-container" id="chat-container">
            <div class="msg-row">
                <div class="msg-content">
                    <div class="avatar ai-avatar">S</div>
                    <div>How can I help you today?</div>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="userInput" placeholder="Message Smarter With AI..." rows="1" onkeydown="checkEnter(event)"></textarea>
                <button class="send-btn" onclick="sendMsg()">↑</button>
            </div>
        </div>
    </div>

    <!-- Payment UI -->
    <div class="overlay" id="overlay">
        <div class="modal">
            <h2>Upgrade to Plus</h2>
            <p>Get the most powerful models and unlimited images.</p>
            <input type="text" placeholder="Card Number" style="width:100%; padding:10px; margin:5px 0; background:#000; color:#fff; border:1px solid #444;">
            <div style="display:flex; gap:5px;">
                <input type="text" placeholder="MM/YY" style="flex:1; padding:10px; background:#000; color:#fff; border:1px solid #444;">
                <input type="text" placeholder="CVC" style="flex:1; padding:10px; background:#000; color:#fff; border:1px solid #444;">
            </div>
            <button class="nav-btn" style="width:100%; background:var(--accent); color:white; margin-top:15px;" onclick="closePay()">Subscribe $20/mo</button>
            <p style="font-size: 0.7rem; margin-top:10px; cursor:pointer;" onclick="closePay()">Cancel</p>
        </div>
    </div>

    <script>
        function setTheme(t) {
            document.getElementById('body').className = t;
            localStorage.setItem('theme', t);
        }

        // Load saved theme
        window.onload = () => {
            const saved = localStorage.getItem('theme');
            if(saved) setTheme(saved);
        };

        function checkEnter(e) {
            if(e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMsg();
            }
        }

        function sendMsg() {
            const input = document.getElementById('userInput');
            const container = document.getElementById('chat-container');
            const history = document.getElementById('history');

            if(!input.value.trim()) return;

            // User message
            container.innerHTML += `
                <div class="msg-row" style="background: rgba(255,255,255,0.02)">
                    <div class="msg-content">
                        <div class="avatar user-avatar">U</div>
                        <div>${input.value}</div>
                    </div>
                </div>`;
            
            // Add to history
            const histItem = document.createElement('div');
            histItem.className = 'history-item';
            histItem.innerText = input.value;
            history.prepend(histItem);

            const val = input.value;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            // AI Response simulation
            setTimeout(() => {
                container.innerHTML += `
                    <div class="msg-row">
                        <div class="msg-content">
                            <div class="avatar ai-avatar">S</div>
                            <div>I've analyzed your request: "${val}". This feature is currently in simulation mode. Upgrade to Plus for live API access!</div>
                        </div>
                    </div>`;
                container.scrollTop = container.scrollHeight;
            }, 1000);
        }

        function newChat() {
            document.getElementById('chat-container').innerHTML = `
                <div class="msg-row">
                    <div class="msg-content">
                        <div class="avatar ai-avatar">S</div>
                        <div>New Chat Started. How can I help?</div>
                    </div>
                </div>`;
        }

        function openPay() { document.getElementById('overlay').style.display = 'flex'; }
        function closePay() { document.getElementById('overlay').style.display = 'none'; }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smarter With AI | Pro Dashboard</title>
    <style>
        :root { --bg: #0f172a; --text: #f8fafc; --accent: #38bdf8; --card: #1e293b; }
        .theme-white { --bg: #ffffff; --text: #0f172a; --accent: #2563eb; --card: #f1f5f9; }
        .theme-pink { --bg: #1a0b16; --text: #fdf2f8; --accent: #ec4899; --card: #2d1226; }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; transition: 0.3s; overflow-x: hidden; }
        
        /* Background Slideshow Effect */
        .slideshow { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.15; }
        .slideshow img { width: 100%; height: 100%; object-fit: cover; position: absolute; animation: fade 15s infinite; opacity: 0; }
        @keyframes fade { 0% {opacity: 0;} 10% {opacity: 1;} 33% {opacity: 1;} 43% {opacity: 0;} }

        .navbar { display: flex; justify-content: space-between; padding: 20px 5%; background: rgba(0,0,0,0.2); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; }
        .nav-right { display: flex; gap: 15px; align-items: center; }

        .container { max-width: 1000px; margin: 50px auto; padding: 20px; text-align: center; }
        
        /* Dashboard Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: var(--card); padding: 30px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); text-align: left; }
        
        /* Inputs */
        textarea { width: 100%; background: rgba(255,255,255,0.05); color: var(--text); border: 1px solid var(--accent); padding: 15px; border-radius: 10px; margin-top: 10px; resize: none; }
        .btn { background: var(--accent); color: white; padding: 12px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
        
        /* Theme Buttons */
        .theme-btn { width: 25px; height: 25px; border-radius: 50%; border: 2px solid white; cursor: pointer; }
    </style>
</head>
<body id="body">

    <div class="slideshow">
        <img src="https://images.unsplash.com/photo-1677442136019-21780ecad995" style="animation-delay: 0s;">
        <img src="https://images.unsplash.com/photo-1620712943543-bcc4628c9757" style="animation-delay: 5s;">
        <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe" style="animation-delay: 10s;">
    </div>

    <nav class="navbar">
        <div style="font-weight: bold; font-size: 1.5rem;">Smarter With AI</div>
        <div class="nav-right">
            <div class="theme-btn" style="background: black;" onclick="setTheme('')"></div>
            <div class="theme-btn" style="background: white;" onclick="setTheme('theme-white')"></div>
            <div class="theme-btn" style="background: #ec4899;" onclick="setTheme('theme-pink')"></div>
            <button class="btn" onclick="alert('Auth coming in V3!')">Sign In</button>
        </div>
    </nav>

    <div class="container">
        <h1>Welcome Back, Creator</h1>
        <p>Your history and tools are synced and ready.</p>

        <div class="grid">
            <div class="card">
                <h3>💬 Ask AI Anything</h3>
                <div id="chat-history" style="height: 100px; overflow-y: auto; font-size: 0.9rem; color: var(--accent); margin-bottom: 10px;">
                    <i>No history yet...</i>
                </div>
                <textarea placeholder="Type your prompt here..."></textarea>
                <button class="btn" style="margin-top: 10px;">Send Prompt</button>
            </div>

            <div class="card">
                <h3>🎨 Create AI Image</h3>
                <p>Describe the image you want to generate.</p>
                <textarea placeholder="A futuristic city in neon pink..."></textarea>
                <button class="btn" style="margin-top: 10px;">Generate</button>
            </div>
        </div>

        <div style="margin-top: 50px;">
            <h3>Login with Socials</h3>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="btn" style="background: #333;">GitHub</button>
                <button class="btn" style="background: #db4437;">Google</button>
                <button class="btn" style="background: #000;">Apple</button>
            </div>
        </div>
    </div>

    <script>
        function setTheme(theme) {
            document.getElementById('body').className = theme;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smarter With AI | Pro Dashboard</title>
    <style>
        :root { --bg: #0f172a; --text: #f8fafc; --accent: #38bdf8; --card: rgba(30, 41, 59, 0.7); --sidebar: #0b1120; }
        .theme-white { --bg: #f8fafc; --text: #0f172a; --accent: #2563eb; --card: rgba(255, 255, 255, 0.8); --sidebar: #f1f5f9; }
        .theme-pink { --bg: #1a0b16; --text: #fdf2f8; --accent: #ec4899; --card: rgba(45, 18, 38, 0.7); --sidebar: #120610; }

        body { font-family: 'Inter', -apple-system, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; transition: background 0.3s, color 0.3s; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 280px; background: var(--sidebar); border-right: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; padding: 25px; z-index: 10; }
        .history-item { padding: 12px; border-radius: 10px; margin-bottom: 8px; background: rgba(255,255,255,0.05); font-size: 0.9rem; cursor: pointer; border: 1px solid transparent; transition: 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-item:hover { background: rgba(255,255,255,0.1); border-color: var(--accent); }

        /* Main Content */
        .main-content { flex: 1; overflow-y: auto; position: relative; display: flex; flex-direction: column; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: rgba(0,0,0,0.1); backdrop-filter: blur(15px); sticky; top: 0; z-index: 5; }
        
        .container { max-width: 800px; margin: auto; padding: 40px 20px; width: 100%; box-sizing: border-box; }
        .card { background: var(--card); backdrop-filter: blur(10px); padding: 30px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }

        /* Payment Form */
        #payment-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 400px; z-index: 100; }
        .payment-input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }

        /* Buttons & Inputs */
        .btn { background: var(--accent); color: white; padding: 12px 24px; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn:hover { filter: brightness(1.2); transform: translateY(-2px); }
        
        .login-bubbles { display: flex; gap: 20px; justify-content: center; margin-top: 20px; }
        .bubble { width: 50px; height: 50px; border-radius: 50%; background: white; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .bubble:hover { transform: scale(1.1); }
        .bubble img { width: 25px; height: 25px; }

        textarea { width: 100%; background: rgba(0,0,0,0.2); color: var(--text); border: 2px solid var(--accent); padding: 15px; border-radius: 15px; margin-top: 15px; resize: none; font-size: 1rem; outline: none; }
        
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 90; backdrop-filter: blur(5px); }
    </style>
</head>
<body id="body">

    <div class="overlay" id="overlay" onclick="closePay()"></div>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2 style="font-weight: 900; letter-spacing: -1px; color: var(--accent);">SMARTER AI</h2>
        <button class="btn" style="width: 100%; margin: 20px 0;" onclick="newChat()">+ New Chat</button>
        
        <div id="history-list" style="flex: 1; overflow-y: auto;">
            <div class="history-item">✨ How to start a business</div>
            <div class="history-item">🎨 AI Image Prompt Guide</div>
        </div>

        <div style="padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);">
            <p style="font-size: 0.8rem; opacity: 0.6;">Appearance</p>
            <div style="display: flex; gap: 12px;">
                <div onclick="setTheme('')" style="width:25px; height:25px; background:#0f172a; border-radius:50%; cursor:pointer; border:2px solid #fff;"></div>
                <div onclick="setTheme('theme-white')" style="width:25px; height:25px; background:#ffffff; border-radius:50%; cursor:pointer; border:2px solid #ccc;"></div>
                <div onclick="setTheme('theme-pink')" style="width:25px; height:25px; background:#ec4899; border-radius:50%; cursor:pointer; border:2px solid #fff;"></div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <nav class="navbar">
            <span style="opacity: 0.7;">v2.5 Stable</span>
            <button class="btn" onclick="openPay()" style="background: linear-gradient(to right, #8b5cf6, #ec4899);">Upgrade to Plus</button>
        </nav>

        <div class="container">
            <div class="card" id="welcome-card">
                <h2 style="margin-top:0;">Ready to get smarter?</h2>
                <p style="opacity:0.8;">Sign in to sync your AI history and custom models.</p>
                <div class="login-bubbles">
                    <div class="bubble" onclick="window.open('https://google.com', '_blank')"><img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png"></div>
                    <div class="bubble" onclick="window.open('https://apple.com', '_blank')"><img src="https://cdn-icons-png.flaticon.com/512/888/888841.png"></div>
                    <div class="bubble" onclick="window.open('https://github.com', '_blank')"><img src="https://cdn-icons-png.flaticon.com/512/25/25231.png"></div>
                </div>
            </div>

            <div class="card">
                <div id="chat-window" style="height: 120px; overflow-y: auto; margin-bottom: 10px; font-size: 0.95rem;">
                    <div style="color: var(--accent);">AI: Waiting for your command...</div>
                </div>
                <textarea id="user-input" rows="3" placeholder="Type message and press Enter..." onkeypress="handleEnter(event)"></textarea>
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button class="btn" style="flex:1" onclick="sendMessage()">Send Message</button>
                    <button class="btn" style="flex:1; background:transparent; border:1px solid var(--accent);" onclick="sendMessage()">Generate Image</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Payment Modal -->
    <div class="card" id="payment-modal">
        <h3 style="text-align:center;">Subscribe to Plus</h3>
        <p style="text-align:center; font-size:0.8rem; opacity:0.7;">$20.00 / month</p>
        <label>Card Information</label>
        <input type="text" class="payment-input" placeholder="1234 5678 9101 1121">
        <div style="display:flex; gap:10px;">
            <input type="text" class="payment-input" placeholder="MM/YY">
            <input type="text" class="payment-input" placeholder="CVC">
        </div>
        <input type="text" class="payment-input" placeholder="Cardholder Name">
        <button class="btn" style="width:100%; margin-top:10px;" onclick="alert('Success! Welcome to Plus.')">Pay Now</button>
        <p style="text-align:center; cursor:pointer; font-size:0.8rem; margin-top:15px;" onclick="closePay()">Cancel</p>
    </div>

    <script>
        let currentTheme = '';

        function setTheme(theme) {
            currentTheme = theme;
            document.getElementById('body').className = theme;
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function sendMessage() {
            const input = document.getElementById('user-input');
            const chat = document.getElementById('chat-window');
            const history = document.getElementById('history-list');

            if (!input.value.trim()) return;

            // Add to history sidebar
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerText = input.value;
            history.prepend(item);

            // Show in chat
            chat.innerHTML = `<div style="opacity:0.6;">You: ${input.value}</div><div>AI: Thinking...</div>`;
            
            const text = input.value;
            input.value = '';

            setTimeout(() => {
                chat.innerHTML = `<div>AI: I've processed "${text}". How else can I assist?</div>`;
            }, 8000);
        }

        function newChat() {
            // Clears the chat but keeps the theme
            document.getElementById('chat-window').innerHTML = `<div style="color: var(--accent);">AI: New Chat Started.</div>`;
            document.getElementById('user-input').value = '';
            // Note: currentTheme remains active on body
        }

        function openPay() {
            document.getElementById('payment-modal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }

        function closePay() {
            document.getElementById('payment-modal').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smarter With AI | Pro</title>
    <style>
        :root { --bg: #000000; --text: #ffffff; --accent: #007aff; --ai-bubble: #1c1c1e; --user-bubble: #007aff; }
        .theme-white { --bg: #ffffff; --text: #000000; --accent: #007aff; --ai-bubble: #e9e9eb; --user-bubble: #007aff; }

        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; transition: 0.3s; }

        /* Sidebar */
        .sidebar { width: 260px; background: rgba(20,20,20,0.8); backdrop-filter: blur(10px); border-right: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; padding: 20px; }
        .nav-btn { background: var(--accent); border: none; color: white; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: 600; margin-bottom: 20px; }

        /* Main Chat Area */
        .main { flex: 1; display: flex; flex-direction: column; position: relative; }
        .header { padding: 15px 25px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }

        /* iMessage Bubbles & Animation */
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        
        .bubble { max-width: 70% ; padding: 12px 18px; border-radius: 20px; font-size: 0.95rem; line-height: 1.4; position: relative; animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { from { opacity: 0; transform: scale(0.8) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        .ai { align-self: flex-start; background: var(--ai-bubble); color: var(--text); border-bottom-left-radius: 4px; }
        .user { align-self: flex-end; background: var(--user-bubble); color: white; border-bottom-right-radius: 4px; }

        /* Dropdown Login */
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content { display: none; position: absolute; right: 0; background: #2c2c2e; min-width: 160px; border-radius: 10px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); z-index: 100; overflow: hidden; }
        .dropdown-content a { color: white; padding: 12px 16px; text-decoration: none; display: block; font-size: 0.9rem; }
        .dropdown-content a:hover { background: #3a3a3c; }
        .dropdown:hover .dropdown-content { display: block; }

        /* Input Area */
        .input-area { padding: 20px; background: transparent; }
        .input-wrapper { max-width: 800px; margin: auto; background: rgba(255,255,255,0.1); border-radius: 25px; padding: 5px 15px; display: flex; align-items: center; }
        textarea { flex: 1; background: transparent; border: none; color: white; padding: 12px; outline: none; resize: none; font-size: 1rem; }
    </style>
</head>
<body id="body">

    <div class="sidebar">
        <h2 style="font-size: 1.2rem; letter-spacing: -0.5px;">Smarter AI</h2>
        <button class="nav-btn" onclick="newChat()">New Conversation</button>
        <div style="margin-top: auto; font-size: 0.8rem; opacity: 0.5;">
            <p onclick="setTheme('')" style="cursor:pointer">Dark Mode</p>
            <p onclick="setTheme('theme-white')" style="cursor:pointer">Light Mode</p>
        </div>
    </div>

    <div class="main">
        <div class="header">
            <span style="font-weight: 600;">Intelligence v4.0</span>
            <div class="dropdown">
                <button class="nav-btn" style="margin-bottom:0; padding: 8px 15px;">Sign In ▼</button>
                <div class="dropdown-content">
                    <a href="#" onclick="authPopup('https://github.com/login')">GitHub Login</a>
                    <a href="#" onclick="authPopup('https://accounts.google.com')">Google Login</a>
                </div>
            </div>
        </div>

        <div class="chat-container" id="chat">
            <div class="bubble ai">Hello! I am Smarter AI. Ask me anything, and I will provide a logical response.</div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="textInput" placeholder="Message..." rows="1" onkeydown="handleEnter(event)"></textarea>
                <button onclick="send()" style="background:none; border:none; color:var(--accent); font-weight:bold; cursor:pointer;">Send</button>
            </div>
        </div>
    </div>

    <script>
        function setTheme(t) { document.getElementById('body').className = t; }

        function authPopup(url) {
            const w = 500, h = 600;
            const left = (screen.width/2)-(w/2);
            const top = (screen.height/2)-(h/2);
            window.open(url, 'auth', `width=${w},height=${h},top=${top},left=${left}`);
        }

        function handleEnter(e) { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }

        function send() {
            const input = document.getElementById('textInput');
            const chat = document.getElementById('chat');
            const val = input.value.trim();
            if(!val) return;

            // User Message
            chat.innerHTML += `<div class="bubble user">${val}</div>`;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            // AI Logic Engine
            setTimeout(() => {
                let response = "";
                const lowVal = val.toLowerCase();

                if(lowVal.includes("who are you")) response = "I am Smarter AI, a high-performance language model designed to help you build and scale your ideas.";
                else if(lowVal.includes("how to make money")) response = "The most effective way to monetize AI in 2026 is by building 'wrappers'—sites like this one that solve specific problems for users using AI automation.";
                else if(lowVal.includes("image")) response = `Generating that for you... <br><img src="https://picsum.photos/seed/${Math.random()}/400/300" style="width:100%; border-radius:10px; margin-top:10px;">`;
                else if(lowVal.includes("help")) response = "I can help you write code, design business strategies, or generate creative content. What's your goal today?";
                else response = `Regarding "${val}", the most logical approach is to analyze the core components first, then apply an iterative solution. Would you like me to break down a step-by-step plan for this?`;

                chat.innerHTML += `<div class="bubble ai">${response}</div>`;
                chat.scrollTop = chat.scrollHeight;
            }, 800;
        }

        function newChat() {
            document.getElementById('chat').innerHTML = `<div class="bubble ai">New session started. How can I assist?</div>`;
        }
    </script>
</body>
</html>

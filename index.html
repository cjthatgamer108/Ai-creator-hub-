<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smarter With AI | Pro</title>
    <style>
        :root { --bg: #0f172a; --text: #f8fafc; --accent: #38bdf8; --card: #1e293b; --sidebar: #0b1120; }
        .theme-white { --bg: #ffffff; --text: #0f172a; --accent: #2563eb; --card: #f1f5f9; --sidebar: #e2e8f0; }
        .theme-pink { --bg: #1a0b16; --text: #fdf2f8; --accent: #ec4899; --card: #2d1226; --sidebar: #120610; }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; transition: 0.3s; overflow: hidden; }
        
        /* Sidebar / History Tab */
        .sidebar { width: 260px; background: var(--sidebar); border-right: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; padding: 20px; }
        .history-item { padding: 12px; border-radius: 8px; margin-bottom: 10px; background: rgba(255,255,255,0.05); font-size: 0.85rem; cursor: pointer; border: 1px solid transparent; }
        .history-item:hover { border-color: var(--accent); }

        /* Main Content */
        .main-content { flex: 1; overflow-y: auto; position: relative; }
        .slideshow { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.1; }
        .slideshow img { width: 100%; height: 100%; object-fit: cover; position: absolute; animation: fade 12s infinite; opacity: 0; }
        @keyframes fade { 0% {opacity: 0;} 10% {opacity: 1;} 33% {opacity: 1;} 43% {opacity: 0;} }

        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: rgba(0,0,0,0.2); backdrop-filter: blur(10px); sticky; top: 0; }
        
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .card { background: var(--card); padding: 25px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 25px; }

        /* Paywall / Subscription */
        .paywall { background: linear-gradient(135deg, #6366f1, #a855f7); padding: 20px; border-radius: 12px; color: white; margin-top: 20px; text-align: center; display: none; }
        
        .btn { background: var(--accent); color: white; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
        .social-grid { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
        .social-btn { padding: 10px; border-radius: 8px; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: #1e293b; }

        textarea { width: 100%; background: rgba(0,0,0,0.2); color: var(--text); border: 1px solid var(--accent); padding: 12px; border-radius: 10px; margin-top: 10px; resize: none; box-sizing: border-box; }
        .theme-dot { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid white; }
    </style>
</head>
<body id="body">

    <!-- History Sidebar -->
    <div class="sidebar">
        <h3 style="color: var(--accent);">📜 History</h3>
        <button class="btn" style="margin-bottom: 20px; width: 100%;" onclick="location.reload()">+ New Chat</button>
        <div id="history-list">
            <div class="history-item">How to use Luma AI...</div>
            <div class="history-item">Viral TikTok Hooks...</div>
            <div class="history-item">Image Prompt: Neon City...</div>
        </div>
        
        <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);">
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <div class="theme-dot" style="background: #0f172a;" onclick="setTheme('')"></div>
                <div class="theme-dot" style="background: #ffffff;" onclick="setTheme('theme-white')"></div>
                <div class="theme-dot" style="background: #ec4899;" onclick="setTheme('theme-pink')"></div>
            </div>
            <small>Smarter With AI v2.0</small>
        </div>
    </div>

    <!-- Main View -->
    <div class="main-content">
        <div class="slideshow">
            <img src="https://images.unsplash.com/photo-1620712943543-bcc4628c9757">
            <img src="https://images.unsplash.com/photo-1677442136019-21780ecad995">
        </div>

        <nav class="navbar">
            <div style="font-weight: bold;">SMARTER WITH AI</div>
            <button class="btn" onclick="showSub()">💎 Upgrade to Plus</button>
        </nav>

        <div class="container">
            <!-- Subscription Tab (Hidden by default) -->
            <div id="sub-tab" class="paywall">
                <h3>Unlock Smarter With AI Plus</h3>
                <p>Unlimited Images • Faster Responses • GPT-5 Access</p>
                <button class="btn" style="background: white; color: black;" onclick="alert('Payment processing simulated...')">$20/month - Get Started</button>
                <p style="font-size: 0.7rem; margin-top: 10px;" onclick="hideSub()">Close</p>
            </div>

            <div class="card">
                <h3>👋 Welcome Back</h3>
                <p>Login to sync your history across devices.</p>
                <div class="social-grid">
                    <div class="social-btn" onclick="alert('Connecting GitHub...')">GH</div>
                    <div class="social-btn" onclick="alert('Connecting Google...')">G</div>
                    <div class="social-btn" onclick="alert('Connecting Apple...')">A</div>
                </div>
            </div>

            <div class="card">
                <h3>💬 Chat & Imagine</h3>
                <div id="chat-output" style="height: 100px; overflow-y: auto; font-size: 0.9rem; margin-bottom: 10px; color: var(--accent);"></div>
                <textarea id="main-input" placeholder="Ask anything or describe an image..."></textarea>
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button class="btn" style="flex: 1;" onclick="process('Chat')">Send Message</button>
                    <button class="btn" style="flex: 1; background: transparent; border: 1px solid var(--accent);" onclick="process('Image')">Generate Image</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function setTheme(theme) { document.getElementById('body').className = theme; }
        
        function showSub() { document.getElementById('sub-tab').style.display = 'block'; }
        function hideSub() { document.getElementById('sub-tab').style.display = 'none'; }

        function process(type) {
            const input = document.getElementById('main-input');
            const output = document.getElementById('chat-output');
            const history = document.getElementById('history-list');
            
            if (!input.value) return;

            // Add to history
            const newHistory = document.createElement('div');
            newHistory.className = 'history-item';
            newHistory.innerText = input.value.substring(0, 20) + "...";
            history.prepend(newHistory);

            output.innerHTML = `<em>${type}: Processing your request...</em>`;
            
            setTimeout(() => {
                output.innerHTML = `<strong>AI:</strong> Done! I've handled your ${type.toLowerCase()} request for "${input.value}".`;
                input.value = "";
            }, 1000);
        }
    </script>
</body>
</html>

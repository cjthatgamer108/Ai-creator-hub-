<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smarter With AI | Official</title>
    <style>
        :root { --bg: #050505; --text: #ececec; --accent: #10a37f; --sidebar: #000000; --card: #212121; }
        .theme-white { --bg: #ffffff; --text: #0f172a; --accent: #2563eb; --sidebar: #f3f4f6; --card: #ffffff; }
        .theme-pink { --bg: #1a0b16; --text: #fdf2f8; --accent: #ec4899; --sidebar: #120610; --card: #2d1226; }

        body { font-family: -apple-system, system-ui, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; transition: 0.3s; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: var(--sidebar); display: flex; flex-direction: column; padding: 15px; border-right: 1px solid rgba(255,255,255,0.1); }
        .nav-btn { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 20px; }
        .history-list { flex: 1; overflow-y: auto; }
        .history-item { padding: 10px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; opacity: 0.7; }
        .history-item:hover { background: rgba(255,255,255,0.1); opacity: 1; }

        /* Main Area */
        .main { flex: 1; display: flex; flex-direction: column; }
        .header { padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        /* Chat Display */
        .chat-container { flex: 1; overflow-y: auto; padding-bottom: 100px; }
        .msg-row { width: 100%; padding: 25px 0; display: flex; justify-content: center; }
        .msg-content { width: 85%; max-width: 700px; display: flex; gap: 20px; }
        .ai-img { width: 100%; max-width: 400px; border-radius: 12px; margin-top: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        /* Input Bar */
        .input-area { position: fixed; bottom: 30px; left: 50%; transform: translateX(-10%); width: 50%; max-width: 700px; }
        .input-box { background: var(--card); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 15px; display: flex; align-items: center; }
        textarea { flex: 1; background: transparent; border: none; color: var(--text); outline: none; font-size: 1rem; resize: none; }

        /* Generic Theme Icons */
        .theme-icon { width: 22px; height: 22px; border: 1px solid #777; cursor: pointer; border-radius: 4px; }

        /* Modal / Payment */
        .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:1000; align-items:center; justify-content:center; }
        .modal { background: var(--card); padding: 30px; border-radius: 16px; width: 350px; border: 1px solid var(--accent); }
        .error-msg { color: #ff4a4a; font-size: 0.8rem; margin-top: 5px; display: none; }
        input { width: 100%; padding: 10px; margin: 8px 0; background: #000; color: #fff; border: 1px solid #444; border-radius: 6px; box-sizing: border-box; }
    </style>
</head>
<body id="body">

    <!-- Payment Modal -->
    <div class="modal-overlay" id="payModal">
        <div class="modal">
            <h2 style="margin-top:0;">Smarter AI Plus</h2>
            <p style="opacity:0.7; font-size:0.9rem;">Enter card details to continue.</p>
            <input type="text" id="cardNum" placeholder="Card Number (16 digits)">
            <div style="display:flex; gap:10px;">
                <input type="text" id="cardExp" placeholder="MM/YY">
                <input type="text" id="cardCVC" placeholder="CVC">
            </div>
            <div id="payError" class="error-msg">❌ Invalid Payment: Please fill all card fields correctly.</div>
            <button class="nav-btn" style="width:100%; margin-top:15px;" onclick="validatePayment()">Pay $20.00</button>
            <p onclick="closePay()" style="cursor:pointer; font-size:0.8rem; text-align:center; margin-top:10px;">Cancel</p>
        </div>
    </div>

    <div class="sidebar">
        <button class="nav-btn" onclick="newChat()">+ New Chat</button>
        <div class="history-list" id="history"></div>
        <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top:15px;">
            <p style="font-size:0.7rem; margin-bottom:10px;">APPEARANCE</p>
            <div style="display:flex; gap:10px; margin-bottom:20px;">
                <div class="theme-icon" style="background:#050505;" onclick="setTheme('')" title="Dark"></div>
                <div class="theme-icon" style="background:#ffffff;" onclick="setTheme('theme-white')" title="Light"></div>
                <div class="theme-icon" style="background:#ec4899;" onclick="setTheme('theme-pink')" title="Pink"></div>
            </div>
            <button class="nav-btn" style="width:100%; background:#444;" onclick="openPay()">Upgrade</button>
        </div>
    </div>

    <div class="main">
        <div class="header">
            <div style="font-weight:bold; font-size:1.2rem;">Smarter With AI</div>
            <div style="display:flex; gap:15px; align-items:center;">
                <span style="font-size:0.8rem; opacity:0.6;">Login to save:</span>
                <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" width="22" style="cursor:pointer" onclick="window.open('https://accounts.google.com', '_blank')" title="Google Login">
                <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" width="22" style="cursor:pointer; filter:invert(1)" onclick="window.open('https://github.com/login', '_blank')" title="GitHub Login">
            </div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="msg-row">
                <div class="msg-content">
                    <div style="color:var(--accent); font-weight:bold;">AI</div>
                    <div>Welcome. Please log in with **Google** or **GitHub** to save your account. How can I help you?</div>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-box">
                <textarea id="userInput" placeholder="Ask anything or 'Generate an image of...'" rows="1" onkeydown="handleKey(event)"></textarea>
                <button onclick="sendMsg()" style="background:none; border:none; color:var(--accent); font-size:1.5rem; cursor:pointer;">↑</button>
            </div>
        </div>
    </div>

    <script>
        function setTheme(t) { document.getElementById('body').className = t; }

        function handleKey(e) { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } }

        function validatePayment() {
            const n = document.getElementById('cardNum').value;
            const ex = document.getElementById('cardExp').value;
            const c = document.getElementById('cardCVC').value;
            if(n.length < 16 || !ex.includes('/') || c.length < 3) {
                document.getElementById('payError').style.display = 'block';
            } else {
                alert("Payment Accepted! Plus features unlocked.");
                closePay();
            }
        }

        function sendMsg() {
            const input = document.getElementById('userInput');
            const container = document.getElementById('chatContainer');
            const val = input.value.trim();
            if(!val) return;

            // User Message
            container.innerHTML += `<div class="msg-row" style="background:rgba(255,255,255,0.03)"><div class="msg-content"><div style="font-weight:bold;">You</div><div>${val}</div></div></div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            // AI Response Logic
            setTimeout(() => {
                let aiResponse = "";
                if(val.toLowerCase().includes("image")) {
                    aiResponse = `I have generated that image for you:<br><img src="https://picsum.photos/seed/${Math.random()}/600/400" class="ai-img">`;
                } else {
                    const answers = ["That's a fascinating perspective.", "I've analyzed the data for that.", "According to current trends, that is highly likely.", "Can you tell me more about that?"];
                    aiResponse = answers[Math.floor(Math.random() * answers.length)];
                }

                container.innerHTML += `<div class="msg-row"><div class="msg-content"><div style="color:var(--accent); font-weight:bold;">AI</div><div>${aiResponse}</div></div></div>`;
                container.scrollTop = container.scrollHeight;
            }, 1000);
        }

        function openPay() { document.getElementById('payModal').style.display = 'flex'; }
        function closePay() { document.getElementById('payModal').style.display = 'none'; }
        function newChat() { document.getElementById('chatContainer').innerHTML = ''; }
    </script>
</body>
</html>
